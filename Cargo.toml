[workspace]
resolver = "3"
members = ["crates/procad-core", "crates/procad-cam", "crates/procad-api"]
default-members = ["crates/procad-core", "crates/procad-cam", "crates/procad-api"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
version = "0.2.0"
repository = "https://github.com/minagayid/procad"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
